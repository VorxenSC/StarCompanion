<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; font-src 'self'; script-src 'self'" />
  <title>Star Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="docked">
  <!-- Closed: a discreet icon. Click opens, drag moves it. -->
  <button class="dock" id="dock" aria-label="Open Star Companion"><img src="icon.png" alt="" draggable="false" /></button>
  <!-- The icon's stand-in while the bar unfolds from (or folds back into) it. -->
  <img class="ghost" id="ghost" src="icon.png" alt="" draggable="false" />

  <!-- Layout from the "Star Companion by Vorxen" Claude Design canvas: brand line, search bar, expanding panel, key hints. -->
  <div class="wrap" id="wrap">
    <div class="brand">
      <span class="brand-name">Star Companion</span>
      <span class="brand-by">by Vorxen</span>
      <span class="brand-filter" id="filter"></span>
      <button class="mine-btn" id="mine-btn" type="button"><img src="mining-icon.svg" alt="" draggable="false" /><span id="mine-label"></span></button>
      <span class="pu" id="pu" hidden></span>
    </div>

    <div class="bar">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span class="bar-grip" aria-hidden="true"><svg width="10" height="18" viewBox="0 0 10 18" fill="currentColor"><circle cx="2" cy="3" r="1.4"/><circle cx="8" cy="3" r="1.4"/><circle cx="2" cy="9" r="1.4"/><circle cx="8" cy="9" r="1.4"/><circle cx="2" cy="15" r="1.4"/><circle cx="8" cy="15" r="1.4"/></svg></span>
      <svg class="bar-icon" width="30" height="30" viewBox="87 89 346 346" fill="none" aria-hidden="true"><circle cx="182" cy="287" r="72" stroke="#EAFBFF" stroke-width="38"/><path d="M242 153 H402 L328 367" stroke="#5FD4E8" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      <label for="q" class="sr-only" data-i18n="Search Star Companion">Search Star Companion</label>
      <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus placeholder="Search items, ships, blueprints, missions, minerals…" />
      <span class="bar-state" id="bar-state" hidden></span>
      <div class="bar-key"><kbd id="hotkey">PageDown</kbd><span data-i18n="hide">hide</span></div>
      <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1 3H8.2M12.8 3H15M1 8H3.2M7.8 8H15M1 13H8.2M12.8 13H15" stroke="currentColor" stroke-width="1.4"/><rect x="9.1" y="0.3999999999999999" width="2.8" height="5.2" rx="1.4" fill="currentColor"/><rect x="4.1" y="5.4" width="2.8" height="5.2" rx="1.4" fill="currentColor"/><rect x="9.1" y="10.4" width="2.8" height="5.2" rx="1.4" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="clear" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" /></svg>
      </button>
    </div>

    <div class="bar-run" id="bar-run" hidden><i></i></div>
    <div class="panel" id="panel">
      <div class="panel-scroll" id="scroll"><div class="panel-content" id="content"></div></div>
    </div>

    <div class="hints">
      <span><b>ENTER</b> <i data-i18n="open">open</i></span>
      <span><b>↑ ↓</b> <i data-i18n="navigate">navigate</i></span>
      <span><b>TAB</b> <i data-i18n="filter">filter</i></span>
      <span><b id="hotkey2">PageDown</b> <i data-i18n="hide">hide</i></span>
      <span class="hints-data" id="dbinfo">Loading database…</span>
      <a class="report-link" id="report-bug" href="#" title="Report a bug" aria-label="Report a bug"><span data-i18n="Report">Report</span><svg width="17" height="17" viewBox="0 0 64 64" fill="none" aria-hidden="true"><defs><mask id="bugTraces" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><g stroke="#000" stroke-width="2.8" stroke-linejoin="round"><path d="M32 60 V35"/><path d="M24 60 V50 L21 47 V43"/><path d="M40 60 V50 L43 47 V43"/><circle cx="32" cy="31" r="3.6"/><circle cx="21" cy="39" r="3.6"/><circle cx="43" cy="39" r="3.6"/></g></mask></defs><g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M26 9 C25 5 22 3 18 3"/><path d="M38 9 C39 5 42 3 46 3"/><path d="M15 27 L8 23 V15"/><path d="M14 38 H4"/><path d="M15 48 L8 52 V60"/><path d="M49 27 L56 23 V15"/><path d="M50 38 H60"/><path d="M49 48 L56 52 V60"/></g><path d="M21 19 C21 12 26 8 32 8 C38 8 43 12 43 19 Z" fill="currentColor"/><path d="M14 23 H50 V38 C50 51 42 60 32 60 C22 60 14 51 14 38 Z" fill="currentColor" mask="url(#bugTraces)"/></svg></a>
      <a class="coffee" id="coffee" href="#" title="Star Companion is free and built in my spare time. If it saved you a trip, a hunt or a few million aUEC, a coffee helps keep it updated every patch. Thank you, citizen — o7">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 6h9v4.5a3 3 0 0 1-3 3h-3a3 3 0 0 1-3-3V6Z" stroke="currentColor" stroke-width="1.4"/><path d="M11.5 7.5h1a1.75 1.75 0 0 1 0 3.5h-1.2" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 1.8c-.6.7.6 1.3 0 2.2M8.5 1.8c-.6.7.6 1.3 0 2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span data-i18n="Buy me a coffee =)">Buy me a coffee =)</span>
      </a>
    </div>
    <div class="grip" id="grip" title="Drag to resize">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M11 3 L3 11 M11 7 L7 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" /></svg>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="search.js"></script>
  <script src="hangar.js"></script>
  <script src="loadout.js"></script>
  <script src="mining.js"></script>
  <script src="hotkey.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
