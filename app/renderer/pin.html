<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'" />
<title>Mineral signatures</title>
<link rel="stylesheet" href="pin.css" />
</head>
<!-- Pinned beside the icon, never focused and click-through: mineral radar signatures to read while
     scanning, or the Executive Hangar timer. -->
<body>
<div class="pin" id="pin">
  <div class="pin-head"><span id="title"></span><span class="pin-unit" id="unit"></span></div>
  <ol class="pin-list" id="list"></ol>
  <div class="pin-hangar" id="hangar" hidden>
    <div class="ph-row"><span class="ph-lights" id="lights"></span><span class="ph-clock" id="clock"></span></div>
    <div class="ph-line" id="line"></div>
  </div>
</div>
<script src="hangar.js"></script>
<script src="pin.js"></script>
</body>
</html>
